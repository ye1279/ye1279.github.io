        @keyframes fall {

    <script>
        (function() {
            // ========== 收藏功能 ==========
            let favorites = [];
            
            function loadFavorites() {
                const saved = localStorage.getItem('global_favorites');
                if (saved) {
                    try {
                        favorites = JSON.parse(saved);
                    } catch(e) { favorites = []; }
                }
            }
            
            function saveFavorites() {
                localStorage.setItem('global_favorites', JSON.stringify(favorites));
            }
            
            function isFavorited(src) {
                return favorites.some(fav => fav.src === src);
            }
            
            function addFavorite(src, name) {
                if (!isFavorited(src)) {
                    favorites.push({ src: src, name: name });
                    saveFavorites();
                    showToast('❤️ 已添加到收藏夹');
                    return true;
                } else {
                    showToast('📌 已在收藏夹中');
                    return false;
                }
            }
            
            function removeFavorite(src) {
                favorites = favorites.filter(fav => fav.src !== src);
                saveFavorites();
                showToast('🗑️ 已从收藏夹移除');
                updateAllFavoriteButtons();
            }
            
            function updateAllFavoriteButtons() {
                document.querySelectorAll('.fav-btn').forEach(btn => {
                    const src = btn.getAttribute('data-src');
                    if (src && isFavorited(src)) {
                        btn.classList.add('favorited');
                        btn.innerHTML = '❤️';
                    } else if (btn) {
                        btn.classList.remove('favorited');
                        btn.innerHTML = '🤍';
                    }
                });
            }
            
            function showToast(message) {
                const toast = document.getElementById('toastMsg');
                if (!toast) return;
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }
            
            // ============================================================
            // 图片数据配置（完整206张）
            // ============================================================
            
            const IMAGES_DATA = [

            console.log(`✅ 衣橱数据加载完成，共 ${IMAGES_DATA.length} 套服设`);
            
            // ========== 以下代码保持不变 ==========
            const FIXED_STYLE_ORDER = ['全部', '日常', '制服', '休闲', '工装', '设计感', '日韩系', 'Q版', '其他'];
            const FIXED_SEASON_ORDER = ['全部', '春', '夏', '秋', '冬'];
            
            let currentStyle = '全部';
            let currentSeason = '全部';
            
            function getFilteredImages() {
                let filtered = IMAGES_DATA;
                if (currentStyle !== '全部') {
                    filtered = filtered.filter(img => {
                        if (Array.isArray(img.style)) return img.style.includes(currentStyle);
                        else return img.style === currentStyle;
                    });
                }
                if (currentSeason !== '全部') {
                    filtered = filtered.filter(img => {
                        if (Array.isArray(img.season)) return img.season.includes(currentSeason);
                        else return img.season === currentSeason;
                    });
                }
                return filtered;
            }
            
            function renderStyleFilters() {
                const container = document.getElementById('styleFilter');
                if (!container) return;
                let html = `<span class="filter-label">🎨 风格：</span>`;
                FIXED_STYLE_ORDER.forEach(style => {
                    if (style === '全部' || IMAGES_DATA.some(img => img.style === style || (Array.isArray(img.style) && img.style.includes(style)))) {
                        const activeClass = (currentStyle === style) ? 'active' : '';
                        html += `<button class="tag-btn ${activeClass}" data-style="${style}">${style}</button>`;
                    }
                });
                container.innerHTML = html;
                document.querySelectorAll('#styleFilter .tag-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentStyle = btn.getAttribute('data-style');
                        renderStyleFilters();
                        renderSeasonFilters();
                        renderImageGridWithFilter();
                        updateFilterStats();
                    });
                });
            }
            
            function renderSeasonFilters() {
                const container = document.getElementById('seasonFilter');
                if (!container) return;
                let html = `<span class="filter-label">🌸 季节：</span>`;
                FIXED_SEASON_ORDER.forEach(season => {
                    if (season === '全部' || IMAGES_DATA.some(img => img.season === season || (Array.isArray(img.season) && img.season.includes(season)))) {
                        const activeClass = (currentSeason === season) ? 'active' : '';
                        html += `<button class="tag-btn ${activeClass}" data-season="${season}">${season}</button>`;
                    }
                });
                container.innerHTML = html;
                document.querySelectorAll('#seasonFilter .tag-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentSeason = btn.getAttribute('data-season');
                        renderStyleFilters();
                        renderSeasonFilters();
                        renderImageGridWithFilter();
                        updateFilterStats();
                    });
                });
            }
            
            function resetFilters() {
                currentStyle = '全部';
                currentSeason = '全部';
                renderStyleFilters();
                renderSeasonFilters();
                renderImageGridWithFilter();
                updateFilterStats();
            }
            
            function updateFilterStats() {
                const filteredImages = getFilteredImages();
                const statsDiv = document.getElementById('filterStats');
                if (statsDiv) {
                    let filterText = [];
                    if (currentStyle !== '全部') filterText.push(`风格「${currentStyle}」`);
                    if (currentSeason !== '全部') filterText.push(`季节「${currentSeason}」`);
                    const filterDesc = filterText.length > 0 ? filterText.join(' + ') : '全部';
                    statsDiv.innerHTML = `🏷️ 当前筛选：${filterDesc} &nbsp;|&nbsp; 📸 共 ${filteredImages.length} 套服设 ✨`;
                }
                const countEle = document.getElementById('clothesCount');
                if(countEle) countEle.innerHTML = `📊 已收录 ${IMAGES_DATA.length} 套完整服设 · 小叶衣橱 🌟`;
            }
            
            function handleImageLoad(imgElement) { imgElement.classList.add('loaded'); }
            
            // 修正：使用 col-xs-6 确保手机端每行2列，同时兼容3列布局
            function getColumnClass() { 
                return `col-md-3 col-sm-6 col-xs-6`; 
            }
            
            function renderImageGridWithFilter() {
                const container = document.getElementById('imageGridContainer');
                if (!container) return;
                const filteredImages = getFilteredImages();
                container.innerHTML = '';
                filteredImages.forEach((image, idx) => {
                    const colDiv = document.createElement('div');
                    colDiv.className = `${getColumnClass()} animated umScaleIn`;
                    // 添加样式确保宽度正确
                    colDiv.style.flex = '0 0 auto';
                    const imgName = `小叶衣橱${idx+1}`;
                    colDiv.innerHTML = `
                        <div class="project-item" data-img-src="${image.src}">
                            <button class="fav-btn" data-src="${image.src}" data-name="${imgName}">🤍</button>
                            <img src="${image.src}" alt="${imgName}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23333%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2212%22%3E图片缺失%3C/text%3E%3C/svg%3E'; this.onerror=null;">
                        </div>
                    `;
                    container.appendChild(colDiv);
                    const img = colDiv.querySelector('img');
                    if (img.complete) handleImageLoad(img);
                    else img.addEventListener('load', () => handleImageLoad(img));
                });
                updateFilterStats();
                bindFavoriteButtons();
                updateAllFavoriteButtons();
            }
            
            function bindFavoriteButtons() {
                document.querySelectorAll('.fav-btn').forEach(btn => {
                    btn.removeEventListener('click', handleFavClick);
                    btn.addEventListener('click', handleFavClick);
                });
            }
            
            function handleFavClick(e) {
                e.stopPropagation();
                const btn = e.currentTarget;
                const src = btn.getAttribute('data-src');
                const name = btn.getAttribute('data-name') || '服饰图片';
                
                if (btn.classList.contains('favorited')) {
                    removeFavorite(src);
                } else {
                    addFavorite(src, name);
                }
                updateAllFavoriteButtons();
            }
            
            function initModal() {
                const modal = document.getElementById('imageModal');
                const modalImage = document.getElementById('modalImage');
                const closeBtn = document.getElementById('modalCloseBtn');
                let isModalOpen = false;
                function openModal(imgSrc) {
                    if (!modal || !modalImage) return;
                    modalImage.src = imgSrc;
                    modalImage.classList.remove('show');
                    void modalImage.offsetWidth;
                    modal.classList.add('show');
                    setTimeout(() => modalImage.classList.add('show'), 10);
                    document.body.classList.add('modal-open');
                    isModalOpen = true;
                }
                function closeModal() {
                    if (!modal || !modalImage) return;
                    modalImage.classList.remove('show');
                    setTimeout(() => { modal.classList.remove('show'); setTimeout(() => { if (!modal.classList.contains('show')) modalImage.src = ''; }, 100); }, 200);
                    document.body.classList.remove('modal-open');
                    isModalOpen = false;
                }
                const container = document.getElementById('imageGridContainer');
                if (container) {
                    container.addEventListener('click', (e) => {
                        let target = e.target;
                        let projectItem = null;
                        while (target && target !== container) {
                            if (target.classList && target.classList.contains('project-item')) { projectItem = target; break; }
                            target = target.parentElement;
                        }
                        if (projectItem) {
                            e.stopPropagation();
                            let imgSrc = projectItem.getAttribute('data-img-src');
                            if (imgSrc) openModal(imgSrc);
                        }
                    });
                }
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
                const backdropArea = document.querySelector('.modal-backdrop-area');
                if (backdropArea) backdropArea.addEventListener('click', closeModal);
                if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isModalOpen) closeModal(); });
            }
            
            function initEffects() {
                const leavesContainer = document.getElementById('fallingLeaves');
                if (leavesContainer) {
                    const leafIcons = ['🍁', '🍂', '🍁', '🍂', '🍁', '🍂'];
                    let leafCount = 0;
                    function addLeaf() {
                        if (leafCount >= 25) return;
                        const leaf = document.createElement('div');
                        leaf.className = 'leaf';
                        leaf.textContent = leafIcons[Math.floor(Math.random() * leafIcons.length)];
                        leaf.style.left = Math.random() * 100 + '%';
                        leaf.style.fontSize = (14 + Math.random() * 18) + 'px';
                        leaf.style.animationDuration = (4 + Math.random() * 7) + 's';
                        leaf.style.opacity = 0.5 + Math.random() * 0.5;
                        leaf.style.animationDelay = Math.random() * 2 + 's';
                        leavesContainer.appendChild(leaf);
                        leafCount++;
                        leaf.addEventListener('animationend', () => { leaf.remove(); leafCount--; });
                    }
                    for (let i = 0; i < 8; i++) setTimeout(() => addLeaf(), i * 100);
                    setInterval(addLeaf, 1200);
                }
                const trophiesContainer = document.getElementById('fallingTrophies');
                if (trophiesContainer) {
                    const trophyIcons = ['🏆', '🏅', '🏆', '🏅', '🏆'];
                    let trophyCount = 0;
                    function addTrophy() {
                        if (trophyCount >= 15) return;
                        const trophy = document.createElement('div');
                        trophy.className = 'trophy';
                        trophy.textContent = trophyIcons[Math.floor(Math.random() * trophyIcons.length)];
                        trophy.style.left = Math.random() * 100 + '%';
                        trophy.style.fontSize = (18 + Math.random() * 20) + 'px';
                        trophy.style.animationDuration = (5 + Math.random() * 7) + 's';
                        trophy.style.animationDelay = Math.random() * 2.5 + 's';
                        trophiesContainer.appendChild(trophy);
                        trophyCount++;
                        trophy.addEventListener('animationend', () => { trophy.remove(); trophyCount--; });
                    }
                    for (let i = 0; i < 5; i++) setTimeout(() => addTrophy(), i * 150);
                    setInterval(addTrophy, 2000);
                }
            }
            
            const starArray = ['⭐', '🌟', '✨', '💫', '⭐✨', '🌟⭐', '✨✨', '⭐️'];
            const fireArray = ['🔥', '🔥🔥', '💥', '⚡', '🔥✨', '🔥💥', '⚡🔥'];
            function createRandomClickEffect(x, y) {
                const isStar = Math.random() > 0.5;
                const element = document.createElement('div');
                element.className = isStar ? 'click-effect-star' : 'click-effect-fire';
                element.textContent = isStar ? starArray[Math.floor(Math.random() * starArray.length)] : fireArray[Math.floor(Math.random() * fireArray.length)];
                element.style.left = x + 'px';
                element.style.top = y + 'px';
                element.style.fontSize = (20 + Math.floor(Math.random() * 20)) + 'px';
                document.body.appendChild(element);
                element.addEventListener('animationend', () => { if (element.parentNode) element.remove(); });
            }
            document.addEventListener('click', (e) => { createRandomClickEffect(e.clientX, e.clientY); });
            
            const backToTop = document.getElementById('backToTop');
            window.addEventListener('scroll', function() { backToTop.classList.toggle('show', window.scrollY > 300); });
            backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            
            const menuToggle = document.getElementById('menuToggle');
            const navLinksDom = document.getElementById('navLinks');
            if (menuToggle && navLinksDom) {
                menuToggle.addEventListener('click', () => { menuToggle.classList.toggle('active'); navLinksDom.classList.toggle('active'); });
                document.querySelectorAll('.nav-links a').forEach(item => item.addEventListener('click', () => { if (window.innerWidth <= 768) { menuToggle.classList.remove('active'); navLinksDom.classList.remove('active'); } }));
            }
            
            // 初始化收藏
            loadFavorites();
            
            renderStyleFilters();
            renderSeasonFilters();
            renderImageGridWithFilter();
            initModal();
            initEffects();
            document.getElementById('resetFilterBtn')?.addEventListener('click', resetFilters);
        })();
    </script>
</body>
</html>

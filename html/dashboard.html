<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>衣橱管理中心 - 荣耀之神的空间</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/animate.css">
    <link rel="icon" href="../img/picture/favicon.ico">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            background: linear-gradient(135deg, #1a1c2e 0%, #2d2a4a 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }

        /* 亮色模式 */
        body.light-mode {
            background: linear-gradient(135deg, #f5f0ff 0%, #e8e0f5 100%);
            color: #1a1c2e;
        }
        
        body.light-mode .card,
        body.light-mode .stat-card,
        body.light-mode .favorite-item {
            background: white;
            color: #1a1c2e;
        }
        
        body.light-mode .nav {
            background: rgba(245, 240, 255, 0.95);
        }
        
        body.light-mode .nav-links a {
            color: #4a3b6e;
        }

        /* ========== 导航栏样式 ========== */
        .nav {
            background: rgba(20, 18, 32, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(169, 91, 195, 0.3);
        }
        
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .nav .title {
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #f5e7a3, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            cursor: pointer;
            z-index: 1001;
        }
        
        .menu-toggle span {
            width: 100%;
            height: 3px;
            background: #c9a5f0;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }
        
        .nav-links a {
            color: #e0d4ff;
            text-decoration: none;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        
        .nav-links a:hover {
            color: #c084fc;
        }
        
        .nav-links p {
            display: inline;
        }
        
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }
            .nav-links {
                position: fixed;
                top: 64px;
                left: -100%;
                width: 70%;
                height: calc(100vh - 64px);
                background: rgba(20, 18, 32, 0.98);
                backdrop-filter: blur(15px);
                flex-direction: column;
                align-items: flex-start;
                padding: 20px 25px;
                gap: 15px;
                transition: left 0.3s ease;
                z-index: 999;
                border-right: 1px solid rgba(169, 91, 195, 0.3);
                overflow-y: auto;
            }
            .nav-links.active {
                left: 0;
            }
            .nav-links a {
                width: 100%;
                padding: 10px 0;
                border-bottom: 1px solid rgba(169, 91, 195, 0.2);
                font-size: 1rem;
            }
            .menu-toggle.active span:nth-child(1) {
                transform: rotate(45deg) translate(6px, 6px);
            }
            .menu-toggle.active span:nth-child(2) {
                opacity: 0;
            }
            .menu-toggle.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -6px);
            }
            .nav .title {
                font-size: 1rem;
            }
        }
        
        @media (min-width: 769px) {
            .nav-links {
                display: flex !important;
            }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .page-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f5e7a3, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        
        .page-header p {
            color: #b6a9e0;
            font-size: 0.85rem;
        }
        
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(169, 91, 195, 0.6), transparent);
            margin: 15px 0 25px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(44, 46, 51, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(169, 91, 195, 0.3);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
        }
        
        .stat-card .emoji {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #c084fc;
        }
        
        .stat-card .label {
            font-size: 0.9rem;
            color: #b6a9e0;
            margin-top: 5px;
        }
        
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #a95bc3, #7b2c9e);
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(169, 91, 195, 0.4);
        }
        
        .theme-btn {
            background: rgba(169, 91, 195, 0.2);
            border: 1px solid rgba(169, 91, 195, 0.5);
        }
        
        .import-btn {
            background: rgba(50, 150, 100, 0.7);
        }
        
        .export-btn {
            background: rgba(200, 120, 50, 0.7);
        }
        
        /* 隐藏的文件输入框 */
        .file-input-hidden {
            display: none;
        }
        
        .recommend-card {
            background: rgba(44, 46, 51, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(169, 91, 195, 0.3);
        }
        
        .recommend-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 15px;
            margin: 15px auto;
            object-fit: cover;
            cursor: pointer;
        }
        
        .favorites-section {
            background: rgba(44, 46, 51, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(169, 91, 195, 0.3);
        }
        
        .favorites-section h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }
        
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .favorite-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            position: relative;
            transition: all 0.2s;
        }
        
        .favorite-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .favorite-item .fav-name {
            font-size: 0.7rem;
            margin-top: 8px;
            color: #b6a9e0;
            word-break: break-word;
        }
        
        .remove-fav-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .remove-fav-btn:hover {
            background: #ff6b6b;
            color: white;
        }
        
        .empty-favorites {
            text-align: center;
            padding: 40px;
            color: #b6a9e0;
        }
        
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }
        
        .quick-link {
            background: rgba(169, 91, 195, 0.15);
            border: 1px solid rgba(169, 91, 195, 0.3);
            border-radius: 30px;
            padding: 8px 20px;
            color: #c9a5f0;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .quick-link:hover {
            background: rgba(169, 91, 195, 0.3);
            transform: translateY(-2px);
        }
        
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #a95bc3, #7b2c9e);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        
        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #888;
            font-size: 0.7rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .page-header h1 {
                font-size: 1.5rem;
            }
            .action-btn {
                padding: 8px 16px;
                font-size: 0.75rem;
            }
            .toast-msg {
                font-size: 0.75rem;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>
    <div class="nav">
        <div class="nav-left">
            <img src="../img/头像.jpg" alt="logo">
            <span class="title">荣耀之神的空间</span>
        </div>
        <div class="menu-toggle" id="menuToggle">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="xinxi.html"><p>小叶的资料</p></a>

    <div class="container">
        <div class="page-header">
            <h1>🌸 衣橱管理中心</h1>
            <p>管理你的收藏· 导入导出备份</p>
            <div class="divider"></div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="emoji">⭐️</div>
                <div class="number" id="totalFavs">0</div>

            </div>
            <div class="stat-card">
                <div class="emoji">📁</div>
                <div class="number">5</div>
                <div class="label">衣橱分类</div>

            <div class="stat-card">
                <div class="emoji">🎴</div>

        </div>

        <!-- 功能按钮区域（新增导入导出） -->

            <button class="action-btn" id="randomBtn">🎲 随机推荐</button>

            <button class="action-btn import-btn" id="importBtn">📥 导入收藏</button>
            <button class="action-btn" id="clearAllFavs" style="background: rgba(100,100,100,0.3);">🗑️ 清空收藏</button>
        </div>
        
        <!-- 隐藏的文件上传 input -->
        <input type="file" id="fileInput" accept=".json" class="file-input-hidden" style="display: none;">

        <div class="recommend-card" id="recommendCard" style="display: none;">
            <h3>🎲 今日推荐</h3>
            <img class="recommend-img" id="recommendImg" alt="推荐图片">
            <p id="recommendInfo" style="margin-top: 10px;"></p>
            <button class="action-btn" id="viewRecommendBtn" style="padding: 8px 20px; font-size: 0.8rem;">📖 查看大图</button>
        </div>

        <div class="favorites-section">
            <h3>❤️ 我的收藏夹 <span id="favCountBadge" style="background: #a95bc3; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem;">0</span></h3>
            <div id="favoritesGrid" class="favorites-grid">
                <div class="empty-favorites">✨ 暂无收藏<br>在其他衣橱页面点击图片右上角的🤍即可收藏</div>

            <a href="tongren.html" class="quick-link">⭐ 同人衣橱</a>
        </div>

        <footer>
            <p>💡 提示：导出收藏可备份到本地，换设备后导入即可恢复</p>

        </footer>

    <div id="toastMsg" class="toast-msg">✨ 提示消息</div>

    <script>
        (function() {
            // ========== 收藏管理 ==========
            let favorites = [];
            
            function loadFavorites() {
                const saved = localStorage.getItem('global_favorites');
                if (saved) {
                    try {
                        favorites = JSON.parse(saved);
                    } catch(e) { favorites = []; }
                }
                renderFavorites();
                updateStats();
            }
            
            function saveFavorites() {
                localStorage.setItem('global_favorites', JSON.stringify(favorites));
                renderFavorites();
                updateStats();
                showToast('收藏已更新');
            }
            
            function renderFavorites() {
                const grid = document.getElementById('favoritesGrid');
                const badge = document.getElementById('favCountBadge');
                const totalFavsSpan = document.getElementById('totalFavs');
                
                if (!grid) return;
                
                if (favorites.length === 0) {
                    grid.innerHTML = '<div class="empty-favorites">✨ 暂无收藏<br>在其他衣橱页面点击图片右上角的🤍即可收藏</div>';
                    if (badge) badge.textContent = '0';
                    if (totalFavsSpan) totalFavsSpan.textContent = '0';
                    return;
                }
                
                if (badge) badge.textContent = favorites.length;
                if (totalFavsSpan) totalFavsSpan.textContent = favorites.length;
                
                grid.innerHTML = '';
                favorites.forEach((fav, index) => {
                    const item = document.createElement('div');
                    item.className = 'favorite-item';
                    item.innerHTML = `
                        <button class="remove-fav-btn" data-index="${index}">✕</button>
                        <img src="${fav.src}" alt="${fav.name}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22 viewBox=%220 0 150 150%22%3E%3Crect width=%22150%22 height=%22150%22 fill=%22%23333%22/%3E%3Ctext x=%2275%22 y=%2280%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2214%22%3E图片加载失败%3C/text%3E%3C/svg%3E';">
                        <div class="fav-name">${escapeHtml(fav.name) || '服饰图片'}</div>
                    `;
                    grid.appendChild(item);
                    
                    const img = item.querySelector('img');
                    img.addEventListener('click', () => {
                        window.open(fav.src, '_blank');
                    });
                    
                    const removeBtn = item.querySelector('.remove-fav-btn');
                    removeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        favorites.splice(index, 1);
                        saveFavorites();
                        showToast('已从收藏夹移除');
                    });
                });
            }
            
            // ========== 导出收藏 ==========
            function exportFavorites() {
                if (favorites.length === 0) {
                    showToast('📭 暂无收藏可导出');
                    return;
                }
                
                const data = {
                    version: '1.0',
                    exportTime: new Date().toLocaleString(),
                    count: favorites.length,
                    favorites: favorites
                };
                
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `yexiu_favorites_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`📁 已导出 ${favorites.length} 条收藏`);
            }
            
            // ========== 导入收藏 ==========
            function importFavorites(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        let importedFavs = [];
                        
                        // 兼容两种格式：直接数组 或 带favorites字段的对象
                        if (Array.isArray(data)) {
                            importedFavs = data;
                        } else if (data.favorites && Array.isArray(data.favorites)) {
                            importedFavs = data.favorites;
                        } else {
                            throw new Error('格式错误');
                        }
                        
                        if (importedFavs.length === 0) {
                            showToast('📭 文件中没有收藏数据');
                            return;
                        }
                        
                        // 去重合并（保留已有的和新导入的）
                        const existingSrc = new Set(favorites.map(f => f.src));
                        let newCount = 0;
                        
                        importedFavs.forEach(fav => {
                            if (fav.src && !existingSrc.has(fav.src)) {
                                favorites.push({
                                    src: fav.src,
                                    name: fav.name || '导入的收藏'
                                });
                                existingSrc.add(fav.src);
                                newCount++;
                            }
                        });
                        
                        if (newCount > 0) {
                            saveFavorites();
                            showToast(`✅ 成功导入 ${newCount} 条新收藏`);
                        } else {
                            showToast('📌 没有新的收藏可导入（已存在）');
                        }
                        
                    } catch(err) {
                        console.error(err);
                        showToast('❌ 文件格式错误，请选择正确的备份文件');
                    }
                };
                reader.onerror = function() {
                    showToast('❌ 文件读取失败');
                };
                reader.readAsText(file);
            }
            
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            
            function clearAllFavorites() {
                if (confirm('确定要清空所有收藏吗？此操作不可恢复。')) {
                    favorites = [];
                    saveFavorites();
                    showToast('已清空所有收藏');
                }
            }
            
            function updateStats() {
                let totalImages = 0;
                const savedTotal = localStorage.getItem('total_images_count');
                if (savedTotal) {
                    totalImages = parseInt(savedTotal) || 0;
                } else {
                    totalImages = 206 + 21 + 49;
                }
                document.getElementById('totalImages').textContent = totalImages;
            }
            
            // ========== 随机推荐 ==========
            const sampleImages = [
                { src: '../img/gufeng/1 (1).jpg', name: '古风·正比1' },
                { src: '../img/gufeng/1 (2).jpg', name: '古风·正比2' },
                { src: '../img/gufeng/1 (7).jpg', name: '古风·Q版1' },
                { src: '../img/clothes/1 (1).jpg', name: '账号卡·正比' },
                { src: '../img/clothes/1 (9).jpg', name: '账号卡·Q版' },
                { src: '../img/spring/1 (1).jpg', name: '日常·春秋' },
                { src: '../img/spring/1 (12).jpg', name: '日常·休闲' },
            ];
            
            let currentRecommend = null;
            
            function randomRecommend() {
                let recommendItem = null;
                if (favorites.length > 0 && Math.random() > 0.3) {
                    const randomIndex = Math.floor(Math.random() * favorites.length);
                    const fav = favorites[randomIndex];
                    recommendItem = { src: fav.src, name: fav.name };
                } else {
                    const randomIndex = Math.floor(Math.random() * sampleImages.length);
                    recommendItem = { ...sampleImages[randomIndex] };
                }
                
                currentRecommend = recommendItem;
                const recommendCard = document.getElementById('recommendCard');
                const recommendImg = document.getElementById('recommendImg');
                const recommendInfo = document.getElementById('recommendInfo');
                
                if (recommendCard && recommendImg && recommendInfo) {
                    recommendCard.style.display = 'block';
                    recommendImg.src = recommendItem.src;
                    recommendImg.alt = recommendItem.name;
                    recommendInfo.innerHTML = `✨ ${escapeHtml(recommendItem.name)}<br>点击下方按钮查看大图`;
                    showToast('🎲 已为你推荐一张图片');
                }
            }
            
            function viewRecommend() {
                if (currentRecommend) {
                    window.open(currentRecommend.src, '_blank');
                }
            }
            
            // ========== 主题切换 ==========
            function initTheme() {
                const savedTheme = localStorage.getItem('dashboard_theme');
                if (savedTheme === 'light') {
                    document.body.classList.add('light-mode');
                    const themeBtn = document.getElementById('themeBtn');
                    if (themeBtn) themeBtn.innerHTML = '☀️ 切换主题';
                }
            }
            
            function toggleTheme() {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                localStorage.setItem('dashboard_theme', isLight ? 'light' : 'dark');
                const themeBtn = document.getElementById('themeBtn');
                if (themeBtn) {
                    themeBtn.innerHTML = isLight ? '☀️ 切换主题' : '🌙 切换主题';
                }
                showToast(isLight ? '☀️ 亮色模式已开启' : '🌙 暗色模式已开启');
            }
            
            // ========== 提示消息 ==========
            let toastTimeout;
            function showToast(message) {
                const toast = document.getElementById('toastMsg');
                if (!toast) return;
                if (toastTimeout) clearTimeout(toastTimeout);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }
            
            // ========== 汉堡菜单 ==========
            const menuToggle = document.getElementById('menuToggle');
            const navLinksEl = document.getElementById('navLinks');
            if (menuToggle && navLinksEl) {
                menuToggle.addEventListener('click', () => {
                    menuToggle.classList.toggle('active');
                    navLinksEl.classList.toggle('active');
                });
                document.querySelectorAll('.nav-links a').forEach(a => {
                    a.addEventListener('click', () => {
                        if (window.innerWidth <= 768) {
                            menuToggle.classList.remove('active');
                            navLinksEl.classList.remove('active');
                        }
                    });
                });
                document.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        if (!navLinksEl.contains(e.target) && !menuToggle.contains(e.target)) {
                            menuToggle.classList.remove('active');
                            navLinksEl.classList.remove('active');
                        }
                    }
                });
            }
            
            // ========== 初始化 ==========
            loadFavorites();
            initTheme();
            
            document.getElementById('randomBtn')?.addEventListener('click', randomRecommend);
            document.getElementById('viewRecommendBtn')?.addEventListener('click', viewRecommend);
            document.getElementById('themeBtn')?.addEventListener('click', toggleTheme);
            document.getElementById('clearAllFavs')?.addEventListener('click', clearAllFavorites);
            
            // 导出按钮
            document.getElementById('exportBtn')?.addEventListener('click', exportFavorites);
            
            // 导入按钮（触发文件选择）
            const importBtn = document.getElementById('importBtn');
            const fileInput = document.getElementById('fileInput');
            if (importBtn && fileInput) {
                importBtn.addEventListener('click', () => {
                    fileInput.click();
                });
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        importFavorites(e.target.files[0]);
                        fileInput.value = ''; // 清空，允许重复导入同一文件
                    }
                });
            }
            
            localStorage.setItem('total_images_count', '275');
            updateStats();
            
            console.log('🌸 衣橱管理中心 | 导入导出功能已启用');
        })();
    </script>
</body>
</html>
